[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-pipeline"
version = "0.1.0"
description = "Commercial VTuber avatar and accessory pipeline using open-source tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "anime-face-detector",
    "trimesh[easy]",
    "pydantic>=2.0",
    "pyyaml",
    "pillow",
    "numpy",
    "scipy",
    "click>=8.0",
]

[project.scripts]
"vtuber-pipeline" = "vtuber_pipeline.cli:cli"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
