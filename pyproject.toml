[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-pipeline"
version = "0.1.0"
description = "Commercial VTuber avatar and accessory pipeline using open-source tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anime-face-detector==0.1.0",
    "trimesh[easy]",
    "pydantic>=2.0",
    "pyyaml",
    "pillow",
    "numpy",
    "scipy",
    "click>=8.0",
    "pygltflib==1.16.5",
]

[project.scripts]
"vtuber-pipeline" = "vtuber_pipeline.cli:cli"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = false
