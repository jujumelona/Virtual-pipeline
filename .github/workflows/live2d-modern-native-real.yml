name: PSD2Live 3.6 genuine native model trial

on:
  push:
    branches: [main]
    paths:
      - "tools/vts_psd2live_modern.py"
      - "tools/vts_modern_editable_project.py"
      - "tools/vts_reference_keyform_author.py"
      - "tools/vts_modern_mcp_probe.py"
      - "tools/vts_modern_real_mesh_trial.py"
      - "tools/vts_multiview_runtime.py"
      - "tools/vts_open_quality_cases.py"
      - ".github/workflows/live2d-modern-native-real.yml"
  workflow_dispatch:

jobs:
  public-art-real-modern-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PSD, Cubism export and quality gate dependencies
        run: |
          python -m pip install "Pillow>=11,<13" "numpy>=2,<3" "scipy>=1.14,<2" "psd-tools>=1.14,<2" "pygltflib>=1.16,<2"
      - name: Fetch independently authored public CC0 model source (SHA-256 verified)
        run: |
          python -m tools.vts_open_quality_cases --case ds --output /tmp/psd2live-cc0
      - name: Convert genuine PSD with official PSD2Live v3.6.0 Gradle app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.vts_psd2live_modern import run_modern_psd2live
          base = Path("/tmp/psd2live-cc0/case")
          candidates = sorted(base.rglob("psd-input/*.psd"))
          if len(candidates) != 1:
              raise RuntimeError("PUBLIC_CASE_AMBIGUOUS_PSD_SOURCE: " + str(candidates))
          report = run_modern_psd2live(
              candidates[0], Path("/tmp/modern-real-output"),
              edition="pro", clone=True, timeout_seconds=1800)
          assert report["runtime_references_valid"] is True
          assert report["cmo3"] and report["model3_json"]
          assert report["version_ref"] == "v3.6.0"
          print(json.dumps({
              "state": "REAL_PSD2LIVE_V360_ARTIFACTS_VERIFIED",
              "model3": report["model3_json"], "cmo3": report["cmo3"],
              "native_runtime_pose_verified": False,
              "artistic_quality_verified": False,
          }, indent=2))
          PY
      - name: Import the SAME real PSD into the v3.6 headless MCP and save an editable rig
        run: |
          python -m tools.vts_modern_editable_project \
            --psd /tmp/psd2live-cc0/case/ds/psd-input/ds.psd \
            --source "$HOME/.cache/vtuber-pipeline/psd2live-v3.6.0" \
            --output /tmp/psd2live-editable-real
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/psd2live-editable-real/editable_project_report.json").read_text())
          assert report["source_imported"] is True
          assert report["rig_generate_committed"] is True
          assert report["saved_project_produced"] is True
          assert Path(report["editable_project"]).stat().st_size > 1024
          print("REAL_V360_EDITABLE_PROJECT_VERIFIED", report["editable_project"])
          PY
      - name: Reopen EXACT exported CMO3 as editable project preserving native rig
        run: |
          python -m tools.vts_modern_editable_project \
            --cmo3 /tmp/modern-real-output/ds.cmo3 \
            --source "$HOME/.cache/vtuber-pipeline/psd2live-v3.6.0" \
            --output /tmp/psd2live-imported-cmo3
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/psd2live-imported-cmo3/editable_project_report.json").read_text())
          assert report["source_native_rig_imported"]
          assert report["rig_regeneration_performed"] is False
          assert Path(report["editable_project"]).stat().st_size > 1024
          print("REAL_V360_CMO3_TO_EDITABLE_NO_REGEN_VERIFIED", report["editable_project"])
          PY
      - name: Inspect real editable CMO3 mesh and Warp structure via isolated v3.6 MCP
        run: |
          python -m tools.vts_modern_mcp_probe \
            --project /tmp/psd2live-imported-cmo3/ds.psd2live \
            --source "$HOME/.cache/vtuber-pipeline/psd2live-v3.6.0" \
            --output /tmp/psd2live-edit-probe
      - name: Commit REAL structure-guided mesh edit on exported CMO3 and verify new native MOC3
        run: |
          python -m tools.vts_modern_real_mesh_trial \
            --project /tmp/psd2live-imported-cmo3/ds.psd2live \
            --source "$HOME/.cache/vtuber-pipeline/psd2live-v3.6.0" \
            --output /tmp/psd2live-real-mesh-trial
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/psd2live-real-mesh-trial/real_mesh_trial.json").read_text())
          assert d["native_project_opened"] and d["editable_copy_saved"]
          assert d["mesh_changes_committed"] and d["model_exported"]
          assert Path(d["model3_json"]).is_file()
          print("REAL_V360_CMO3_MESH_EDIT_AND_EXPORT_VERIFIED", d["selected_target"])
          PY
      - name: Render actually modified native Cubism Core MOC3 poses in headless OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglu1-mesa
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.vts_multiview_runtime import render_actual_native_moc3
          result_path=Path("/tmp/psd2live-real-mesh-trial/real_mesh_trial.json")
          edited=json.loads(result_path.read_text())
          assert edited["mesh_changes_committed"] and edited["model_exported"]
          model=Path(edited["model3_json"])
          native=render_actual_native_moc3(model, Path("/tmp/psd2live-real-native-poses"), timeout_seconds=600)
          assert native["source"] == "live2d_py_cubism_native_runtime"
          assert native["native_pose_rendered"] and native["pose_activity_passed"]
          assert native.get("native_pose_geometry_passed"), native
          print("REAL_V360_EDITED_MOC3_CUBISM_CORE_POSES_VERIFIED")
          PY
      - name: Upload logs, artifacts and native rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psd2live-v360-real-logs
          path: |
            /tmp/psd2live_modern_cli.log
            /tmp/modern-real-output/**
            /tmp/psd2live-editable-real/**
            /tmp/psd2live-imported-cmo3/**
            /tmp/psd2live-edit-probe/**
            /tmp/psd2live-real-mesh-trial/**
            /tmp/psd2live-real-native-poses/**
            /content/vtuber_builder/third_party/modern_psd2live_clone.log
          if-no-files-found: ignore
          retention-days: 5
