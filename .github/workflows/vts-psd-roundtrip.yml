name: VTS PSD round-trip gate
on:
  push:
    branches: [main]
    paths:
      - "tools/vts_artwork_export.py"
      - "tools/vts_psd_layer.py"
      - "tools/vts_production.py"
      - "tools/vts_handoff_process.py"
      - "tools/vts_handoff_worker.py"
      - "tools/vts_psd_diagnose.py"
      - "tools/vts_subprocess.py"
      - "tools/vts_asset_input.py"
      - "vtuber_pipeline/two_d/layer_export.py"
      - "notebooks/VTuber_Commercial_Pipeline_Colab_v8.ipynb"
      - "tests/test_vts_handoff_process.py"
      - "tests/test_vts_psd_diagnose.py"
      - "tests/test_vts_artwork_export.py"
      - "tests/test_vts_production_contract.py"
      - ".github/workflows/vts-psd-roundtrip.yml"
  workflow_dispatch:

jobs:
  layered-psd-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real PSD serializing runtime
        run: python -m pip install "psd-tools[composite]==1.14.2" "Pillow>=10" "numpy<3" pytest
      - name: Run PSD save/read regression tests
        run: |
          python -m pytest -q tests/test_vts_artwork_export.py -k \
            "cubism_psd_bakes_alpha_without_remaining_layer_masks or cubism_psd_declares_the_official_srgb_profile or realistic_multigroup_psd_roundtrip or psd_roundtrip_preserves_hidden_rgb or completed_see_through_psd_repackages or generated_psd_and_external_psd or native_psd_rgba_channel_roundtrip or psd_runtime_preflight or psd_mismatch_writes or generated_psd_save_avoids or byte_exact_roundtrip_does_not_run_icc"
      - name: Verify validated sRGB registration avoids duplicate native color conversion
        run: python -m pytest -q tests/test_vts_production_contract.py -k "srgb_psd_registration or external_psd_cannot_silently_relabel"
      - name: Verify executable NF4 batch control flow and Colab cells on Python ${{ matrix.python }}
        run: python -m pytest -q tests/test_vts_cpu_wiring_smoke.py
      - name: Verify fatal child signals preserve the notebook supervisor
        run: timeout 120 python -m pytest -q tests/test_vts_handoff_process.py tests/test_vts_psd_diagnose.py
