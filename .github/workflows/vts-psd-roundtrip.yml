name: VTS PSD round-trip gate
on:
  push:
    branches: [main]
    paths:
      - "tools/vts_artwork_export.py"
      - "tools/vts_psd_layer.py"
      - "tests/test_vts_artwork_export.py"
      - ".github/workflows/vts-psd-roundtrip.yml"
  workflow_dispatch:

jobs:
  layered-psd-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real PSD serializing runtime
        run: python -m pip install "psd-tools==1.14.2" "Pillow>=10" "numpy<3" pytest
      - name: Run PSD save/read regression tests
        run: |
          python -m pytest -q tests/test_vts_artwork_export.py -k \
            "cubism_psd_bakes_alpha_without_remaining_layer_masks or cubism_psd_declares_the_official_srgb_profile or realistic_multigroup_psd_roundtrip or psd_roundtrip_preserves_hidden_rgb"
