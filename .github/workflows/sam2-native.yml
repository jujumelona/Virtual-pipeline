name: SAM2 real inference contract
on:
  push:
    branches: [main]
    paths:
      - "tools/install_2d_workers.py"
      - "tools/model_workers/sam_worker.py"
      - "ci/sam2_native_e2e.py"
      - "third_party.lock.json"
      - ".github/workflows/sam2-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sam2-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU Torch/Torchvision matching pinned SAM2
        run: |
          timeout 720 python -m pip install --only-binary=:all: \
            "torch==2.6.0" "torchvision==0.21.0" \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install explicit source runtime dependencies
        run: |
          timeout 400 python -m pip install --only-binary=:all: \
            "hydra-core==1.3.2" "portalocker==2.10.1" \
            "numpy<3" pillow tqdm "huggingface-hub==0.36.2"
          # iopath 0.1.10 is sdist on PyPI; it cannot use --only-binary.
          timeout 200 python -m pip install --no-deps --no-build-isolation "iopath==0.1.10"
      - name: Checkout exact upstream SAM2 source and install without dependency substitution
        run: |
          mkdir -p "$RUNNER_TEMP/sam-src"
          cd "$RUNNER_TEMP/sam-src"
          git init -q
          git remote add origin https://github.com/facebookresearch/sam2
          timeout 180 git fetch --depth 1 origin 2b90b9f5ceec907a1c18123530e92e794ad901a4
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "2b90b9f5ceec907a1c18123530e92e794ad901a4"
          SAM2_BUILD_CUDA=0 timeout 180 python -m pip install --no-deps --no-build-isolation --editable .
      - name: Construct actual SAM2 Hydra graph and run pretrained CPU mask inference
        env:
          PYTHONUNBUFFERED: "1"
          HYDRA_FULL_ERROR: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/sam2-diagnostics"
          export PYTHONPATH="$PWD"
          timeout 900 python -u ci/sam2_native_e2e.py 2>&1 | tee "$RUNNER_TEMP/sam2-diagnostics/sam2.log"
      - name: Preserve complete reproducible SAM2 trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2-native-cpu-evidence
          path: ${{ runner.temp }}/sam2-diagnostics/
          if-no-files-found: warn
          retention-days: 7
