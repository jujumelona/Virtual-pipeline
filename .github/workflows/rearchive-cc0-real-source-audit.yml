name: REARCHIVE pinned CC0 source audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/vts_cc0_source_layer_audit.py'
      - 'tools/vts_rearchive_cc0_repaint.py'
      - '.github/workflows/rearchive-cc0-real-source-audit.yml'
  workflow_dispatch:
jobs:
  inspect-real-cc0:
    strategy:
      fail-fast: false
      matrix:
        cc0_case: [hiakari-inori, kirishima-mio, star_lan]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10" "psd-tools==1.14.2" "numpy>=1.26"
      - name: Download verified upstream CC0 rig and inspect its real PSD
        run: python -m tools.vts_cc0_source_layer_audit --case "${{ matrix.cc0_case }}" --out "$RUNNER_TEMP/source_audit" --export-guides
      - name: Create actual painted mint-eye REARCHIVE texture prototype
        if: matrix.cc0_case == 'hiakari-inori'
        run: python -m tools.vts_rearchive_cc0_repaint --source-guides "$RUNNER_TEMP/source_audit/CC0_SOURCE_LAYER_PAINT_GUIDES.zip" --out "$RUNNER_TEMP/rearchive_repaint"
      - name: Publish actually edited source art (not a completed rig)
        if: matrix.cc0_case == 'hiakari-inori'
        uses: actions/upload-artifact@v4
        with:
          name: rearchive-edited-33-source-parts-unrigged
          path: ${{ runner.temp }}/rearchive_repaint/
          if-no-files-found: error
          retention-days: 14
      - name: Attach actual PSD individual layer templates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rearchive-cc0-${{ matrix.cc0_case }}-paint-guides
          path: ${{ runner.temp }}/source_audit/CC0_SOURCE_LAYER_PAINT_GUIDES.zip
          if-no-files-found: error
          retention-days: 14
      - name: Attach verified source PSD layer metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rearchive-cc0-${{ matrix.cc0_case }}-inventory
          path: ${{ runner.temp }}/source_audit/source_layer_audit.json
          if-no-files-found: ignore
          retention-days: 14
