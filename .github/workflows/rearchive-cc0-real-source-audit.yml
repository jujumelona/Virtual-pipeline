name: REARCHIVE pinned CC0 source audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/vts_cc0_source_layer_audit.py'
      - '.github/workflows/rearchive-cc0-real-source-audit.yml'
  workflow_dispatch:
jobs:
  inspect-real-cc0:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10" "psd-tools==1.14.2"
      - name: Download verified upstream CC0 Hiakari rig and inspect its actual PSD
        run: python -m tools.vts_cc0_source_layer_audit --case hiakari-inori --out "$RUNNER_TEMP/source_audit"
      - name: Attach source PSD layer inventory (not full archive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rearchive-cc0-layer-inventory
          path: ${{ runner.temp }}/source_audit/source_layer_audit.json
          if-no-files-found: ignore
          retention-days: 14
