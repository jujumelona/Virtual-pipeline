name: Publish 24 matte clay VTuber kits
on:
  push:
    branches: [main]
    paths:
      - "tools/normalize_matte_clay_kits.py"
      - ".github/workflows/publish-matte-clay-kits.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-vtuber-matte-clay-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Rewrite and inspect each of the 24 real instruction ZIPs
        run: |
          python tools/normalize_matte_clay_kits.py --write
          python tools/normalize_matte_clay_kits.py --check
      - name: Publish 24 replaced existing canonical ZIPs directly to main
        run: |
          if git diff --quiet -- docs/image_ai_kits_v2/zips; then
            echo "All 24 instruction ZIPs are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image_ai_kits_v2/zips/*.zip
          git commit -m "fix(image-ai): publish matte-clay BODY and scoped asset instructions in 24 ZIPs"
          git pull --rebase origin main
          git push origin HEAD:main
