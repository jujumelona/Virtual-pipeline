name: Build Cubism PRO template-first instruction ZIPs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-cubism-pro-zips.yml"
      - "tools/rebuild_cubism_pro_zips.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild-cubism-pro-zips
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python source and run Cubism PRO handoff tests
        run: |
          python -m compileall -q tools/vts_cubism_pro.py tools/rebuild_cubism_pro_zips.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_cubism_pro_handoff.py
      - name: Rebuild ten Live2D source ZIPs
        run: |
          python tools/rebuild_cubism_pro_zips.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tools.rebuild_cubism_pro_zips import KIT_NAMES, ROOT
          for filename in KIT_NAMES:
              with ZipFile(ROOT/filename) as z:
                  assert len(z.namelist()) == 14
                  assert z.testzip() is None
                  for entry in ('00_MASTER_FIRST.md', '02_ADVANCED_PARTS.md',
                                '04_OUTPUT_FILES.md', '07_REVIEW_BEFORE_FINAL_ZIP.md'):
                      assert 'CUBISM_PRO_TEMPLATE_FIRST_V1' in z.read(entry).decode('utf-8')
              print('VERIFIED', filename)
          PY
      - name: Audit all 18 source ZIPs and verify canonical generator
        run: |
          node tools/build_source_only_kits_v7.js --check
          python -m tools.audit_24_image_kits --strict
      - name: Publish regenerated original ZIPs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image_ai_kits_v2/zips/face.zip
          git add docs/image_ai_kits_v2/zips/live2d_*.zip
          if git diff --cached --quiet; then
            echo "Already up to date"; exit 0
          fi
          git commit -m "build: publish Cubism PRO-ready Live2D source ZIPs"
          git pull --rebase origin main
          git push origin HEAD:main
