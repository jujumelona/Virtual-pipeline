name: Inochi native SDK integration
on:
  push:
    branches: [main]
    paths:
      - "tools/inochi_native/**"
      - "tools/setup_inochi_runtime.py"
      - "vtuber_pipeline/two_d/inochi_bridge.py"
      - "tests/production/test_inochi_native_compatibility.py"
      - "ci/inochi_2d_fullgraph_e2e.py"
      - ".github/workflows/inochi-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d-sdk-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned D toolchain and software OpenGL libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ldc dub libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev zlib1g-dev pkg-config xvfb xauth
      - name: Compile genuine Inochi SDK 0.8.7 exporter
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/inochi-compiler"
          ldc2 --version | tee "$RUNNER_TEMP/inochi-compiler/toolchain.log"
          dub --version | tee -a "$RUNNER_TEMP/inochi-compiler/toolchain.log"
          VTUBER_INOCHI_RUNTIME_DIR="$RUNNER_TEMP/inochi-runtime" \
            python tools/setup_inochi_runtime.py 2>&1 | tee "$RUNNER_TEMP/inochi-compiler/native_build.log"
      - name: Verify native exporter is executable
        run: |
          file tools/inochi_native/vtuber-inochi-native
          test -x tools/inochi_native/vtuber-inochi-native
      - name: Verify native official SDK puppet export and reimport under software OpenGL
        env:
          VTUBER_INOCHI_NATIVE: tools/inochi_native/vtuber-inochi-native
        run: |
          python -m pip install -q pytest pillow numpy scipy opencv-python-headless psd-tools==1.11.0
          export PYTHONPATH="$PWD"
          PYTHONPATH="$PWD" VTUBER_INOCHI_NATIVE="$PWD/tools/inochi_native/vtuber-inochi-native" \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            python ci/inochi_native_sdk_e2e.py
          VTUBER_INOCHI_NATIVE="$PWD/tools/inochi_native/vtuber-inochi-native" \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            python tools/inochi_native/smoke_native.py "$RUNNER_TEMP/inochi-multi-parameter"
          PYTHONPATH="$PWD" VTUBER_REAL_2D_NATIVE_E2E_DIR="$RUNNER_TEMP/inochi-full-2d" \
            VTUBER_INOCHI_NATIVE="$PWD/tools/inochi_native/vtuber-inochi-native" \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            python ci/inochi_2d_fullgraph_e2e.py
      - name: Verify D SDK producer's binary is not silently faked
        run: |
          python -m pytest -q tests/production/test_inochi_native_compatibility.py
      - name: Upload actual native INP and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inochi-sdk-native-inp-proof
          path: |
            ${{ runner.temp }}/inochi-multi-parameter/result/avatar.inp
            ${{ runner.temp }}/inochi-multi-parameter/result/native_export_report.json
            ${{ runner.temp }}/inochi-multi-parameter/result/inochi_native.log
            ${{ runner.temp }}/inochi-full-2d/avatar.inp
            ${{ runner.temp }}/inochi-full-2d/avatar.psd
            ${{ runner.temp }}/inochi-full-2d/avatar.ora
            ${{ runner.temp }}/inochi-full-2d/production_result.json
            ${{ runner.temp }}/inochi-full-2d/native_export_report.json
            ${{ runner.temp }}/inochi-compiler/*.log
          if-no-files-found: warn
          retention-days: 14
