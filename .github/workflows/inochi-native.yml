name: Inochi native SDK integration
on:
  push:
    branches: [main]
    paths:
      - "tools/inochi_native/**"
      - "vtuber_pipeline/two_d/inochi_bridge.py"
      - "tests/production/test_inochi_native_compatibility.py"
      - ".github/workflows/inochi-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d-sdk-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned D toolchain and software OpenGL libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ldc dub libsdl2-dev libgl1-mesa-dev xvfb xauth
      - name: Compile genuine Inochi SDK 0.8.7 exporter
        run: |
          dub build --root=tools/inochi_native --compiler=ldc2 --build=release
      - name: Verify native exporter is executable
        run: |
          file tools/inochi_native/vtuber-inochi-native
          test -x tools/inochi_native/vtuber-inochi-native
      - name: Verify native official SDK puppet export and reimport under software OpenGL
        env:
          VTUBER_INOCHI_NATIVE: tools/inochi_native/vtuber-inochi-native
        run: |
          python -m pip install -q pytest pillow numpy
          PYTHONPATH="$PWD" VTUBER_INOCHI_NATIVE="$PWD/tools/inochi_native/vtuber-inochi-native" \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            python ci/inochi_native_sdk_e2e.py
          VTUBER_INOCHI_NATIVE="$PWD/tools/inochi_native/vtuber-inochi-native" \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            python tools/inochi_native/smoke_native.py "$RUNNER_TEMP/inochi-multi-parameter"
      - name: Verify D SDK producer's binary is not silently faked
        run: |
          python -m pytest -q tests/production/test_inochi_native_compatibility.py
