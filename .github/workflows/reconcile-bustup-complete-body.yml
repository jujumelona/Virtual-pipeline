name: Reconcile Live2D bustup final art
on:
  push:
    branches: [main]
    paths:
      - "tools/reconcile_bustup_complete_body.py"
      - "tests/test_image_ai_kits_cross_contamination.py"
      - "tests/test_image_ai_bustup_face_first.py"
      - "tests/test_image_ai_canonical_body_packaging.py"
      - ".github/workflows/reconcile-bustup-complete-body.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile-bustup-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify current canonical art instructions without rewriting them
        run: |
          python tools/image_ai_read_first_gate.py --check
          python tools/apply_existing_vtuber_template_slots.py --check
          python tools/apply_image_ai_multiview_briefs.py --check
          python tools/sync_image_ai_geometry_guidance.py --check
      - name: Regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest pillow
          python -m pytest -q tests/test_image_ai_bustup_face_first.py tests/test_image_ai_geometry_guidance.py tests/test_image_ai_kits_scope_contract.py tests/test_image_ai_kits_cross_contamination.py tests/test_live2d_bust_up_kits.py tests/test_image_ai_kits_24_v5_gate.py tests/test_image_ai_kits_v2.py tests/test_image_ai_advanced_craft_guidance.py tests/test_image_ai_layer_order_delivery.py
