name: Reconcile Live2D bustup final art
on:
  push:
    branches: [main]
    paths:
      - "tools/reconcile_bustup_complete_body.py"
      - ".github/workflows/reconcile-bustup-complete-body.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-bustup-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Repair canonical sources, snapshots and four ZIPs
        run: |
          python tools/reconcile_bustup_complete_body.py --write
          python tools/reconcile_bustup_complete_body.py --check
          python -m compileall -q tools/reconcile_bustup_complete_body.py
      - name: Regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest pillow
          python -m pytest -q tests/test_image_ai_bustup_face_first.py tests/test_image_ai_geometry_guidance.py tests/test_image_ai_kits_scope_contract.py tests/test_image_ai_kits_cross_contamination.py tests/test_live2d_bust_up_kits.py tests/test_image_ai_kits_24_v5_gate.py tests/test_image_ai_kits_v2.py tests/test_image_ai_advanced_craft_guidance.py tests/test_image_ai_layer_order_delivery.py
      - name: Publish canonical changed files directly to main
        run: |
          if git diff --quiet -- docs/image_ai_kits_v2; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image_ai_kits_v2/source docs/image_ai_kits_v2/builder_inputs/2D.json docs/image_ai_kits_v2/zips/live2d_bust_up__*.zip
          git commit -m "docs(live2d): reconcile canonical bustup body PSD and arm-hand requirements"
          git pull --rebase origin main
          git push origin HEAD:main
