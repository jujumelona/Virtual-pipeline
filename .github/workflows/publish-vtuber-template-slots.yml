name: Verify existing template slots and published 2D briefs

on:
  push:
    branches: [main]
    paths:
      - "docs/image_ai_kits_v2/source/EXISTING_TEMPLATE_SLOT_REGISTRY.json"
      - "tools/apply_existing_vtuber_template_slots.py"
      - "tools/apply_image_ai_multiview_briefs.py"
      - "tools/image_ai_quality_first_gate.py"
      - "tools/reconcile_image_ai_legacy_conflicts.py"
      - "tools/image_ai_read_first_gate.py"
      - ".github/workflows/publish-vtuber-template-slots.yml"
  workflow_dispatch:

# This former publishing job reintroduced legacy PSD/isolated_parts
# image-AI output instructions by rerunning older generation scripts.
# Current publication is exclusively through update_source_only_body_kits.
permissions:
  contents: read

jobs:
  check-no-old-brief-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure template references and all 336 briefs remain consistent
        run: |
          python -m tools.audit_24_image_kits --strict
          python -m tools.update_source_only_body_kits --check
