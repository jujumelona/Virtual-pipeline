name: Publish existing VTuber template slots
on:
  push:
    branches: [main]
    paths:
      - "docs/image_ai_kits_v2/source/EXISTING_TEMPLATE_SLOT_REGISTRY.json"
      - "tools/apply_existing_vtuber_template_slots.py"
      - "tests/test_existing_vtuber_template_slots.py"
      - ".github/workflows/publish-vtuber-template-slots.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  template-mapping-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply 24 mapped existing templates to published instructions
        run: |
          python tools/apply_existing_vtuber_template_slots.py --write
          python tools/apply_existing_vtuber_template_slots.py --check
      - name: Confirm mapping and do not break existing 14 MD releases
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_existing_vtuber_template_slots.py tests/test_image_ai_kits_cross_contamination.py tests/test_repair_broadcast_bustup_briefs.py
      - name: Publish only changed canonical ZIPs to main
        run: |
          if git diff --quiet -- docs/image_ai_kits_v2/zips; then
            echo "No ZIP change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image_ai_kits_v2/zips/*.zip
          git commit -m "docs(image-ai): bind 24 ZIPs to verified external templates and fillable slots"
          git push origin HEAD:main
