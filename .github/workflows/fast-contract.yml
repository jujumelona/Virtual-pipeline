name: Fast contract gate
on:
  push:
    branches: [main]
    paths:
      - "vtuber_pipeline/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/fast-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail early for invalid production Python
        run: python -m compileall -q vtuber_pipeline tools tests
      - name: Install CPU-only contract dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            pytest numpy scipy pillow==12.3.0 trimesh==4.12.2 \
            click psd-tools==1.11.0 pygltflib==1.16.5
          python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Verify recently changed production seams
        run: |
          python -m pytest -q \
            tests/test_multiview_fitting.py \
            tests/test_visual_alignment.py \
            tests/test_cubism_export_validation.py \
            tests/test_psd_layer_roundtrip.py \
            tests/test_prefetch_mode_contract.py \
            tests/test_instantmesh_license_guard.py \
            tests/test_2d_worker_setup_contract.py \
            tests/integration/test_pipeline_wiring_static.py \
            tests/integration/test_module_graph_runtime.py \
            tests/test_cli_production_registration.py
