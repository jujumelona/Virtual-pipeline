name: Publish final PSD handoff wording
on:
  push:
    branches: [main]
    paths:
      - "docs/image_ai_kits_v2/source/ARTWORK_LAYER_ORDER_CONTRACT.md"
      - "tools/sync_final_artwork_psd_policy.py"
      - ".github/workflows/sync-final-artwork-psd.yml"
  workflow_dispatch:
# Legacy ZIP rewriters are intentionally disabled: re-running them over
# ART_SOURCE_AND_SEPARATION_V3 would restore contradictory per-part generation.
permissions:
  contents: read
jobs:
  validate-current-source-first-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 24 canonical ZIPs, preserving source and split boundaries
        run: |
          python tools/upgrade_24_image_kits_separation.py --check
          python -m tools.audit_24_image_kits --strict
