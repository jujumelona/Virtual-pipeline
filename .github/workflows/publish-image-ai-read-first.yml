name: Publish read-first artwork briefs
on:
  push:
    branches: [main]
    paths:
      - "tools/image_ai_read_first_gate.py"
      - "tests/test_image_ai_read_first_gate.py"
      - ".github/workflows/publish-image-ai-read-first.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repack-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the 24 canonical read-first ZIPs
        run: |
          python tools/image_ai_read_first_gate.py --write
          python tools/image_ai_read_first_gate.py --check
      - name: Regression tests before publishing
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_image_ai_read_first_gate.py tests/test_image_ai_kits_cross_contamination.py
      - name: Commit only the canonical ZIP files to main
        run: |
          if git diff --quiet -- docs/image_ai_kits_v2/zips; then
            echo "Already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/image_ai_kits_v2/zips/*.zip
          git commit -m "docs(image-ai): gate every release ZIP on reading all MD and visual refs"
          git push origin HEAD:main
