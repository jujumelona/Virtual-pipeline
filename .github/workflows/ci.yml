name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve one running full verification while newer main commits arrive.
# GitHub keeps at most one pending run per group, replacing stale pending SHA,
# so continuous patch commits do not kill the only full-suite result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wiring:
    name: Module graph and pipeline wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install CPU wiring dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff numpy scipy pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Compile every Python module
        run: python -m compileall -q vtuber_pipeline tools tests
      - name: Reject undefined names and syntax-level static errors
        run: ruff check --select E9,F63,F7,F82 vtuber_pipeline tools tests
      - name: Verify imports, exports, DAGs, and runtime handoffs
        run: >-
          python -m pytest -q
          tests/integration/test_pipeline_wiring_static.py
          tests/integration/test_module_graph_runtime.py

  model-contract:
    name: Model options and I/O contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install CPU model-contract dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest packaging numpy scipy scikit-image==0.26.0 pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5 psd-tools==1.11.0 "opencv-python-headless>=4.10,<5"
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Verify model/backend option, I/O, and runtime locks
        run: >-
          python -m pytest -q
          tests/integration/test_model_io_contracts.py
          tests/integration/test_runtime_lock_contracts.py
          tests/integration/test_config_contracts.py
          tests/integration/test_marching_cubes_bridge.py
          tests/integration/test_runtime_license_audit.py
          tests/integration/test_triposr_live_logging.py
          tests/integration/test_parallel_assets.py

  unit:
    name: Unit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install CPU CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest numpy scipy pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - run: python -m pytest -q tests/unit

  integration:
    name: CPU integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VTUBER_E2E: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install CPU CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest numpy scipy scikit-image==0.26.0 pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - run: >-
          python -m pytest -q
          tests/integration/test_e2e_pipeline.py
          tests/integration/test_reconstruction.py
          tests/integration/test_marching_cubes_bridge.py
          tests/integration/test_accessory_real_cpu.py
          tests/integration/test_avatar_real_cpu.py
          --maxfail=1

  full-suite:
    name: Full CPU test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VTUBER_E2E: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install complete CPU test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest packaging numpy scipy scikit-image==0.26.0 pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5 psd-tools==1.11.0 "opencv-python-headless>=4.10,<5"
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Discover and run every CPU-safe test
        run: |
          python -m pytest -q tests --strict-markers --strict-config --junitxml=/tmp/full-suite.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/full-suite.xml").getroot()
          skipped = []
          for case in root.iter("testcase"):
              if case.find("skipped") is not None:
                  skipped.append((case.get("classname"), case.get("name")))

          expected = [(
              "tests.integration.test_e2e_pipeline",
              "test_e2e_pipeline",
          )]
          assert skipped == expected, (
              "Unexpected skipped tests; CPU CI must not silently lose coverage",
              skipped,
          )
          print("skip-contract-ok", skipped)
          PY

  package-smoke:
    name: Package and public API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip
      - name: Install CPU CI dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest numpy scipy pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5
      - run: python -m pip install --disable-pip-version-check -e . --no-deps
      - name: Import public API
        run: >-
          python -c "import vtuber_pipeline;
          from vtuber_pipeline.avatar import build_avatar;
          from vtuber_pipeline.accessory import AccessoryPipeline, reconstruct_accessories;
          print('public-api-ok')"
      - run: vtuber-pipeline --help

  package-build:
    name: Build wheel and isolated install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -U pip build packaging
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect distributions
        run: |
          python - <<'PY'
          import email
          import pathlib
          import tarfile
          import tomllib
          import zipfile

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          def normalized_requirement(raw):
              req = Requirement(raw)
              return (
                  canonicalize_name(req.name),
                  tuple(sorted(req.extras)),
                  str(req.specifier),
                  str(req.marker) if req.marker else None,
              )

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          pyproject = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          expected_requires = {
              normalized_requirement(raw)
              for raw in pyproject["project"]["dependencies"]
          }

          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
              required = {
                  "vtuber_pipeline/__init__.py",
                  "vtuber_pipeline/avatar/build.py",
                  "vtuber_pipeline/avatar/triposr_runner.py",
                  "vtuber_pipeline/accessory/build.py",
                  "vtuber_pipeline/cli.py",
              }
              assert required <= names, sorted(required - names)

              metadata_name = next(
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(zf.read(metadata_name))
              actual_requires = {
                  normalized_requirement(raw)
                  for raw in metadata.get_all("Requires-Dist", [])
                  if "extra ==" not in raw
              }
              assert actual_requires == expected_requires, (
                  expected_requires - actual_requires,
                  actual_requires - expected_requires,
              )

              entry_points_name = next(
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              )
              entry_points = zf.read(entry_points_name).decode("utf-8")
              assert (
                  "vtuber-pipeline = vtuber_pipeline.cli:cli"
                  in entry_points
              )

          with tarfile.open(sdists[0], "r:gz") as tf:
              names = tf.getnames()
              assert any(name.endswith("/pyproject.toml") for name in names)
              assert any(name.endswith("/third_party.lock.json") for name in names)
              assert any(name.endswith("/requirements.txt") for name in names)
              assert any(name.endswith("/vtuber_pipeline/avatar/build.py") for name in names)
          PY
      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/vtuber-wheel-smoke
          /tmp/vtuber-wheel-smoke/bin/python -m pip install --disable-pip-version-check -U pip
          /tmp/vtuber-wheel-smoke/bin/python -m pip install --disable-pip-version-check             numpy scipy pyyaml pillow==12.3.0 trimesh==4.12.2 click pygltflib==1.16.5
          /tmp/vtuber-wheel-smoke/bin/python -m pip install --disable-pip-version-check             --no-deps dist/*.whl
          cd /tmp
          /tmp/vtuber-wheel-smoke/bin/python -c "import vtuber_pipeline; from vtuber_pipeline.avatar import build_avatar; from vtuber_pipeline.accessory import AccessoryPipeline; print('wheel-import-ok')"
          /tmp/vtuber-wheel-smoke/bin/vtuber-pipeline --help

  commercial-lock:
    name: Commercial dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate lock and commercial flags
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          data = json.loads(pathlib.Path("third_party.lock.json").read_text(encoding="utf-8"))
          tools = data.get("tools")
          assert isinstance(tools, dict) and tools, "third_party.lock.json has no tools"
          blocked = [
              name
              for name, item in tools.items()
              if not isinstance(item, dict) or item.get("commercial_safe") is not True
          ]
          # A known restricted renderer must stay recorded as unsafe and
          # fail closed at inference. Do not relabel it commercial merely
          # to make CI green. Any new unapproved restriction fails review.
          assert blocked == ["instantmesh_large"], (
              f"unexpected commercial licensing quarantine: {blocked}"
          )
          from pathlib import Path
          worker = Path("tools/model_workers/instantmesh_worker.py").read_text(encoding="utf-8")
          guard = Path("vtuber_pipeline/avatar/commercial_dependency_guard.py")
          prefetch = Path("tools/prefetch_model_assets.py").read_text(encoding="utf-8")
          assert guard.is_file(), "missing commercial dependency guard"
          assert "require_commercial_compatible_upstream(upstream)" in worker
          assert 'name == "instantmesh_large"' in prefetch
          assert "continue" in prefetch, "restricted checkpoint was not deferred"
          blocked_patterns = [
              re.compile(r"\\bAGPL\\b", re.I),
              re.compile(r"GNU Affero General Public License", re.I),
              re.compile(r"\\bGPL(?:-|\\b)", re.I),
              re.compile(r"GNU General Public License", re.I),
              re.compile(r"non[- ]commercial", re.I),
              re.compile(r"CC[- ]BY[- ]NC", re.I),
          ]
          blocked_licenses = {}
          for name, item in tools.items():
              assert item.get("license"), f"{name}: missing license"
              license_texts = [
                  str(item.get("license") or ""),
                  str(item.get("model_license") or ""),
              ]
              models = item.get("models")
              if isinstance(models, dict):
                  license_texts.extend(
                      str(model.get("license") or "")
                      for model in models.values()
                      if isinstance(model, dict)
                  )
              hits = [
                  value
                  for value in license_texts
                  if any(pattern.search(value) for pattern in blocked_patterns)
              ]
              if hits:
                  blocked_licenses[name] = hits
          assert not blocked_licenses, (
              f"blocked license families in commercial lock: {blocked_licenses}"
          )
          print("commercial-lock-quarantine-ok: InstantMesh remains unavailable for commercial inference")
          PY

  gradio-ui:
    name: Real Gradio 6 UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Gradio and test dependencies
        run: python -m pip install --disable-pip-version-check gradio==6.3.0 pytest
      - name: Validate actual Blocks components and live callback outputs
        run: python -m pytest -q ci/test_gradio_live_ui_contract.py

  real-colab-cpu:
    name: Real Colab packages, checkpoints, and CPU neural inference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install actual CPU PyTorch and torchvision
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install the same pinned model dependencies as Colab
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            Pillow==12.3.0 xatlas==0.0.11 scikit-image==0.26.0 \
            moderngl==5.12.0 onnxruntime==1.30.0 \
            "opencv-python-headless>=4.10.0.84" "safetensors>=0.5.3"
          python -m pip install --disable-pip-version-check --prefer-binary \
            omegaconf==2.3.0 einops==0.7.0 transformers==4.57.6 \
            trimesh==4.12.2 rembg==2.0.85 \
            "huggingface-hub>=0.34.0,<1.0" "imageio[ffmpeg]>=2.34.0" \
            "PyYAML>=6.0" "scipy>=1.13" "click>=8.0" \
            pygltflib==1.16.5 psd-tools==1.11.0 "packaging>=24.0" gradio==6.3.0 pytest
          python -m pip install --disable-pip-version-check --no-deps anime-face-detector==0.1.0
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
      - name: NumPy SciPy ABI, Gradio, trimesh and native runtime imports
        run: python -u tools/runtime_abi_probe.py
      - name: Real safetensors state dict and alias tests
        run: python -m pytest -q ci/test_face_weights_runtime.py
      - name: Clone immutable TripoSR production source
        run: |
          git clone https://github.com/VAST-AI-Research/TripoSR.git /tmp/vtuber-ci-triposr
          git -C /tmp/vtuber-ci-triposr checkout --detach 107cefdc244c39106fa830359024f6a2f1c78871
          test "$(git -C /tmp/vtuber-ci-triposr rev-parse HEAD)" = "107cefdc244c39106fa830359024f6a2f1c78871"
      - name: Download actual weights, initialize YOLO/HRNet and TripoSR, run neural forwards
        env:
          TRIPOSR_DIR: /tmp/vtuber-ci-triposr
        run: python -u ci/real_colab_model_smoke.py --device cpu --all-assets --triposr-load

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - wiring
      - model-contract
      - unit
      - integration
      - full-suite
      - package-smoke
      - package-build
      - commercial-lock
      - gradio-ui
      - real-colab-cpu
    steps:
      - name: Require every parallel verification path
        env:
          WIRING: ${{ needs.wiring.result }}
          MODEL_CONTRACT: ${{ needs.model-contract.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          FULL_SUITE: ${{ needs.full-suite.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          PACKAGE_BUILD: ${{ needs.package-build.result }}
          COMMERCIAL_LOCK: ${{ needs.commercial-lock.result }}
          GRADIO_UI: ${{ needs.gradio-ui.result }}
          REAL_COLAB_CPU: ${{ needs.real-colab-cpu.result }}
        run: |
          printf '%s\n'             "wiring=$WIRING"             "model-contract=$MODEL_CONTRACT"             "unit=$UNIT"             "integration=$INTEGRATION"             "full-suite=$FULL_SUITE"             "package-smoke=$PACKAGE_SMOKE"             "package-build=$PACKAGE_BUILD"             "commercial-lock=$COMMERCIAL_LOCK"             "gradio-ui=$GRADIO_UI"             "real-colab-cpu=$REAL_COLAB_CPU"
          test "$WIRING" = success
          test "$MODEL_CONTRACT" = success
          test "$UNIT" = success
          test "$INTEGRATION" = success
          test "$FULL_SUITE" = success
          test "$PACKAGE_SMOKE" = success
          test "$PACKAGE_BUILD" = success
          test "$COMMERCIAL_LOCK" = success
          test "$GRADIO_UI" = success
          test "$REAL_COLAB_CPU" = success
