name: VTS PSD2Live real CLI integration

on:
  push:
    branches: [main]
    paths:
      - "tools/vts_psd2live.py"
      - "tools/vts_native_moc_pose_worker.py"
      - "tools/vts_multiview_runtime.py"
      - "tests/test_vts_multiview_runtime.py"
      - "tools/psd2live_bridge/**"
      - "tools/vts_psd2live_names.py"
      - "tools/vts_production.py"
      - "tools/vts_artwork_export.py"
      - "ci/vts_psd2live_integration.py"
      - "tests/test_vts_psd2live.py"
      - ".github/workflows/vts-psd2live-integration.yml"
  workflow_dispatch:

jobs:
  psd2live-real-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Python verifier
        run: python -m pip install "Pillow==12.3.0" "psd-tools==1.14.2" "numpy<3"
      - name: Build exact PSD2Live v3.3.1 without vendoring third-party code
        run: |
          python -m tools.vts_psd2live --prepare --third-party "$RUNNER_TEMP/psd2live_external"
      - name: Export 60-layer FREE, oversized FREE and upstream PRO through the real pinned JVM
        env:
          VTS_PSD2LIVE_HOME: ${{ runner.temp }}/psd2live_external/psd2live
        run: python -m ci.vts_psd2live_integration
      - name: Load exported real MOC3 in live2d-py and render head/eyes/mouth
        run: |
          python -m pip install --disable-pip-version-check "live2d-py==1.0.0" "pygame" "PyOpenGL"
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth
          fi
          timeout 240s xvfb-run -a python -m tools.vts_native_moc_pose_worker \
            --model3 psd2live-integration-output/pro/model/tml.model3.json \
            --output psd2live-integration-output/native_moc3_pose --size 768
      - name: Upload result and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psd2live-real-cli-evidence
          path: |
            psd2live-integration-output/
            ${{ runner.temp }}/psd2live_external/psd2live_build.log
            ${{ runner.temp }}/psd2live_external/psd2live_clone.log
          if-no-files-found: ignore
