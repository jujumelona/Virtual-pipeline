name: Live2D source-to-rig contract

on:
  push:
    branches: [main]
    paths:
      - "tools/colab_mode_ui.py"
      - "tools/vts_see_through_only.py"
      - "tools/vts_preserved_source_parts.py"
      - "tools/vts_artwork_export.py"
      - "tools/vts_psd2live.py"
      - "tools/vts_psd2live_modern.py"
      - "tools/vts_native_autorepair.py"
      - "tools/vts_reference_keyform_author.py"
      - "tools/vts_ai_landmark_pairs.py"
      - "tools/vts_ai_native_feedback_loop.py"
      - "notebooks/VTuber_Finished_AI_ZIP_All_Modes.ipynb"
      - "notebooks/VTuber_SeeThrough_Only_Source_ZIPs.ipynb"
      - "notebooks/VTuber_Commercial_Pipeline_Colab_v8.ipynb"
      - "tests/test_colab_mode_ui.py"
      - "tests/test_see_through_only_kits.py"
      - "tests/test_vts_preserved_source_parts.py"
      - "tests/test_finished_ai_zip_all_modes_contract.py"
      - "tests/test_vts_native_autorepair.py"
      - "tests/test_vts_psd2live_modern.py"
      - "tests/test_vts_reference_keyform_author.py"
      - "tests/test_vts_reference_mcp_contract.py"
      - "tests/test_vts_ai_landmark_pairs.py"
      - "tests/test_vts_ai_native_feedback_loop.py"
      - ".github/workflows/live2d-source-rig-contract.yml"
  workflow_dispatch:

jobs:
  source-rig-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal contract dependencies
        run: python -m pip install "pytest>=8,<10" "Pillow>=11,<13" "psd-tools>=1.14,<2" "numpy>=2,<3"
      - name: Compile entrypoints and parse notebooks
        run: |
          python -m py_compile tools/colab_mode_ui.py tools/vts_see_through_only.py tools/vts_preserved_source_parts.py tools/vts_artwork_export.py tools/vts_psd2live.py tools/vts_psd2live_modern.py tools/vts_native_autorepair.py tools/vts_reference_keyform_author.py tools/vts_ai_landmark_pairs.py tools/vts_ai_native_feedback_loop.py
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for file in (
              "notebooks/VTuber_Finished_AI_ZIP_All_Modes.ipynb",
              "notebooks/VTuber_SeeThrough_Only_Source_ZIPs.ipynb",
              "notebooks/VTuber_Commercial_Pipeline_Colab_v8.ipynb",
          ):
              notebook = json.loads(Path(file).read_text(encoding="utf-8"))
              for n, cell in enumerate(notebook["cells"]):
                  if cell["cell_type"] == "code":
                      ast.parse("".join(cell["source"]), filename=f"{file}:cell-{n + 1}")
          PY
      - name: Run source ZIP, registration, mode and rig continuation contracts
        run: |
          python -m pytest -q \
            tests/test_colab_mode_ui.py \
            tests/test_see_through_only_kits.py \
            tests/test_vts_preserved_source_parts.py \
            tests/test_finished_ai_zip_all_modes_contract.py \
            tests/test_vts_native_autorepair.py \
            tests/test_vts_psd2live_modern.py \
            tests/test_vts_reference_keyform_author.py \
            tests/test_vts_reference_mcp_contract.py \
            tests/test_vts_ai_landmark_pairs.py \
            tests/test_vts_ai_native_feedback_loop.py
