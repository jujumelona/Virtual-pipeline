<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650"><rect width="1040" height="650" fill="#f7fafc"/><text x="35" y="43" font-family="sans-serif" font-size="27" fill="#1a3145">X/Y keyforms are rig states, not nine source images</text><text x="35" y="76" font-family="sans-serif" font-size="17" fill="#5b6470">Official standard examples: Angle X/Y = -30, 0, +30</text><g fill="#e7f2ff" stroke="#98b9e5" stroke-width="2"><rect x="62" y="110" width="268" height="135" rx="12"/><rect x="386" y="110" width="268" height="135" rx="12"/><rect x="710" y="110" width="268" height="135" rx="12"/><rect x="62" y="265" width="268" height="135" rx="12"/><rect x="386" y="265" width="268" height="135" rx="12"/><rect x="710" y="265" width="268" height="135" rx="12"/><rect x="62" y="420" width="268" height="135" rx="12"/><rect x="386" y="420" width="268" height="135" rx="12"/><rect x="710" y="420" width="268" height="135" rx="12"/></g><g fill="#24466b" font-family="sans-serif" font-size="22" text-anchor="middle"><text x="196" y="184">X -30 / Y +30</text><text x="520" y="184">X 0 / Y +30</text><text x="844" y="184">X +30 / Y +30</text><text x="196" y="339">X -30 / Y 0</text><text x="520" y="339">X 0 / Y 0</text><text x="844" y="339">X +30 / Y 0</text><text x="196" y="494">X -30 / Y -30</text><text x="520" y="494">X 0 / Y -30</text><text x="844" y="494">X +30 / Y -30</text></g><text x="45" y="609" font-family="sans-serif" font-size="19" fill="#5b6470">Conceptual illustration drawn for this repository. Not an official Live2D sample.</text></svg>